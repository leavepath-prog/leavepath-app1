<!--
  Supabase → Authentication → Emails → Magic Link.
  Paste this as the template body. It links to /auth/confirm with a token
  hash, which works on any device or browser (no PKCE code verifier
  needed), so it also works for links sent by the Stripe webhook.
  Subject: Your LeavePath Plan is ready
-->
<div style="font-family: -apple-system, 'Segoe UI', sans-serif; background:#F9F8F5; padding:32px 16px;">
  <div style="max-width:480px; margin:0 auto; background:#ffffff; border:1px solid #E7E5E0; border-radius:20px; padding:32px;">
    <p style="font-family: Georgia, serif; font-size:20px; font-weight:700; color:#134E4A; margin:0 0 16px;">LeavePath</p>
    <h1 style="font-family: Georgia, serif; font-size:26px; color:#1C1917; margin:0 0 12px;">Open your LeavePath Plan</h1>
    <p style="font-size:15px; line-height:1.6; color:#44403C; margin:0 0 24px;">
      Tap the button to sign in. No password needed. The link works once and expires in 1 hour.
    </p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/dashboard"
       style="display:inline-block; background:#134E4A; color:#ffffff; text-decoration:none; font-weight:700; padding:14px 28px; border-radius:999px;">
      Open my dashboard
    </a>
    <p style="font-size:13px; color:#78716C; margin:24px 0 0;">
      Didn't ask for this? You can ignore this email.
    </p>
  </div>
</div>
